name: tuckshop-local

services:
  app:
    build:
      context: .
    image: tuckshop:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      TUCK_PASSWORD: ${TUCK_PASSWORD:?Set TUCK_PASSWORD in .env.local}
      TUCK_SECURE_COOKIES: "false"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - tuckshop_local_data:/data
    read_only: true
    tmpfs:
      # sqlite-jdbc extracts a native .so here; it must be executable.
      - /tmp:exec,mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tuckshop_local_data:
